*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background: var(--obsidian);
  color: var(--silver);
  font-family: var(--font-body);
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 导出专用修正：修复 html2canvas 无法准确渲染 blur/透光色彩的 Bug */
.html2canvas-exporting {
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background-color: #0d1210 !important;
}

::selection{ background: var(--emerald-paper-2); color:var(--silver);}
button{ font-family:inherit; cursor:pointer; }
a{ color:inherit; text-decoration:none; }
::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-track{ background: var(--obsidian); }
::-webkit-scrollbar-thumb{ background: linear-gradient(var(--silver-dim), var(--emerald-paper-2)); border-radius:8px; }

body::before{
  content:"";
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(15,92,66,.22), transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(16,19,18,.9), transparent 70%);
}
.pawfield{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.05;
  background-image: radial-gradient(circle, var(--silver) 1.4px, transparent 1.6px);
  background-size: 140px 140px;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header{
  position: fixed; top:0; left:0; right:0; z-index: 100;
  height: var(--header-h);
  display:flex; align-items:center; justify-content:space-between;
  padding: 0 clamp(18px, 4vw, 56px);
  background: rgba(8,9,10,.85); /* 提高基准不透明度，解决图片下载色彩偏差 */
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(226,231,228,.08);
}
.logo-btn{
  background:none; border:none; display:flex; align-items:center; gap:9px;
  font-family: var(--font-display);
  letter-spacing: .16em;
  font-size: clamp(14px, 1.5vw, 19px);
  font-weight: 600;
  color: var(--silver);
  white-space: nowrap;
  padding: 6px 4px;
}
.logo-btn span.brand{
  background: linear-gradient(120deg, var(--champagne-gold) 0%, var(--silver) 45%, var(--emerald-bright) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.main-nav{ display:flex; gap: clamp(4px,1.6vw,10px); }
.nav-link{
  background:none; border:none; color: var(--silver-2);
  font-family: var(--font-body); font-size: 12.5px; letter-spacing:.09em; text-transform: uppercase;
  padding: 10px 14px; position:relative; border-radius: 3px;
}

/* ============================================================
   VIEWS
   ============================================================ */
main{ position:relative; z-index:1; }
.view{
  display:none; min-height:100vh; padding-top: var(--header-h);
  opacity:0; transform: translateY(14px);
}
.view.active-view{
  display:block; opacity:1; transform:none;
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.eyebrow{
  font-size:11px; letter-spacing:.32em; text-transform:uppercase; color: var(--champagne-gold);
  display:inline-flex; align-items:center; gap:10px; margin-bottom:18px;
}

<!-- JavaScript 修正部分 -->
<script>
// 确保字体完全加载后再执行导出功能，彻底修复第三张图字体跑偏问题
async function downloadCardAsImage(elementId) {
  const targetElement = document.getElementById(elementId);
  if (!targetElement) return;

  // 1. 等待所有 Web 字体加载完毕
  await document.fonts.ready;

  // 2. 临时添加导出专用 class 解决颜色/滤镜失真问题
  targetElement.classList.add('html2canvas-exporting');

  // 3. 执行截图渲染
  html2canvas(targetElement, {
    scale: 2, // 提高清晰度
    useCORS: true, // 允许跨域图片资源
    allowTaint: true,
    backgroundColor: '#08090A' // 强制指定背景色，防止色彩变淡或失真
  }).then(canvas => {
    // 移除导出临时样式
    targetElement.classList.remove('html2canvas-exporting');
    
    // 下载图片
    const link = document.createElement('a');
    link.download = 'hamin-promenade.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err => {
    targetElement.classList.remove('html2canvas-exporting');
    console.error("Download failed:", err);
  });
}
</script>
